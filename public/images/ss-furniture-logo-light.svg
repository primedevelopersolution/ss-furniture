<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="brassGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8CA72" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B88E4F" />
    </linearGradient>
    <linearGradient id="walnutGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D2314" />
      <stop offset="50%" stop-color="#28170D" />
      <stop offset="100%" stop-color="#190E08" />
    </linearGradient>
  </defs>

  <!-- LOGO EMBLEM -->
  <g transform="translate(6, 4)">
    <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#walnutGradLight)" stroke="url(#brassGradLight)" stroke-width="1.5" />
    <rect x="6" y="6" width="52" height="52" rx="10" fill="none" stroke="url(#brassGradLight)" stroke-width="0.75" stroke-dasharray="2 2" stroke-opacity="0.6" />
    
    <path d="M 23 20 C 18 20, 16 23, 16 26 C 16 31, 28 30, 28 36 C 28 40, 25 43, 20 43 C 16 43, 14 41, 14 39" 
          stroke="url(#brassGradLight)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          
    <path d="M 40 21 C 45 21, 48 24, 48 27 C 48 32, 36 31, 36 37 C 36 41, 39 44, 44 44 C 48 44, 50 42, 50 40" 
          stroke="url(#brassGradLight)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          
    <line x1="20" y1="32" x2="44" y2="32" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1" stroke-linecap="round" />
    
    <circle cx="32" cy="15" r="1.5" fill="url(#brassGradLight)" />
    <circle cx="32" cy="49" r="1.5" fill="url(#brassGradLight)" />
  </g>

  <!-- TYPOGRAPHY FOR DARK BG -->
  <text x="82" y="38" 
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif" 
        font-size="25" 
        font-weight="700" 
        letter-spacing="1.5" 
        fill="#FFFFFF">
    S.S. FURNITURE
  </text>

  <text x="83" y="54" 
        font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-size="8.5" 
        font-weight="600" 
        letter-spacing="3.5" 
        fill="#E8CA72">
    HOME FURNITURE SHOWROOM
  </text>
  
  <line x1="83" y1="43" x2="278" y2="43" stroke="#D4AF37" stroke-opacity="0.4" stroke-width="0.8" />
</svg>
